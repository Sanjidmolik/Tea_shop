<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title> Cha Bazaar • </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
    <link href="styles.css" rel="stylesheet" />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light bg-body-tertiary sticky-top shadow-sm">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">🍵 Cha Bazaar ☕</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navContent" aria-controls="navContent" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="#products">Shop</a></li>
          </ul>
          <div class="d-flex align-items-center gap-3">
            <button class="btn btn-outline-secondary position-relative" type="button" data-bs-toggle="offcanvas" data-bs-target="#cartOffcanvas" aria-controls="cartOffcanvas">
              <i class="bi bi-cart3"></i>
              <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" id="cart-count">0</span>
            </button>
          </div>
        </div>
      </div>
    </nav>

    <!-- Hero -->
    <header class="bg-light py-5 border-bottom">
      <div class="container text-center">
        <h1 class="display-5 fw-semibold">Discover Your Perfect Cup</h1>
        <p class="lead text-muted mb-3">Hand-picked teas from the finest gardens. Add to cart and checkout — all in your browser.</p>
        <a href="#products" class="btn btn-success btn-lg">Shop Teas</a>
      </div>
    </header>

    <!-- Products -->
    <main class="container my-5" id="products">
      <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
        <h2 class="m-0">Teas</h2>
        <div class="d-flex gap-2">
          <input type="search" class="form-control" placeholder="Search teas..." id="searchInput" aria-label="Search teas" />
          <select class="form-select" id="sortSelect" aria-label="Sort">
            <option value="featured">Sort: Featured</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="name-asc">Name: A–Z</option>
            <option value="name-desc">Name: Z–A</option>
          </select>
        </div>
      </div>

      <div class="row g-4" id="product-grid" aria-live="polite">
        <!-- JS will render product cards here -->
      </div>
    </main>

    <!-- Cart Offcanvas -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="cartOffcanvas" aria-labelledby="cartLabel">
      <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="cartLabel">Your Cart</h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
      </div>
      <div class="offcanvas-body d-flex flex-column">
        <div id="cart-items" class="vstack gap-3">
          <!-- JS will render cart items here -->
        </div>
        <div class="mt-auto pt-3 border-top">
          <div class="d-flex justify-content-between align-items-center mb-3">
            <span class="fs-5 fw-semibold">Total</span>
            <span class="fs-4 fw-bold" id="cart-total">৳0.00</span>
          </div>
          <div class="d-grid gap-2">
            <button class="btn btn-outline-danger" id="clearCartBtn" type="button">Clear Cart</button>
            <button class="btn btn-success" id="checkoutBtn" type="button">Checkout</button>
          </div>
        </div>
      </div>
    </div>

    <footer class="border-top py-4 text-center text-muted">
      <small>© <span id="year"></span> Cha Bazaar</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="app.js"></script>
  </body>
</html>
